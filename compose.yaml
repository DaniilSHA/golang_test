x-app-env: &app-env
  HTTP_ADDR: :8080
  MYSQL_DSN: ${MYSQL_USER:-taskmanager}:${MYSQL_PASSWORD:-taskmanager_local_password}@tcp(mysql:3306)/${MYSQL_DATABASE:-taskmanager}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or use --env-file .env.example}
  REDIS_ADDR: redis:6379
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_TIMEOUT: ${REDIS_TIMEOUT:-200ms}
  RATE_AUTH_RPM: ${RATE_AUTH_RPM:-10}
  RATE_AUTH_BURST: ${RATE_AUTH_BURST:-5}
  RATE_API_RPM: ${RATE_API_RPM:-120}
  RATE_API_BURST: ${RATE_API_BURST:-20}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmanager}
      MYSQL_USER: ${MYSQL_USER:-taskmanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskmanager_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["migrate"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_MYSQL_DSN: ${MYSQL_USER:-taskmanager}:${MYSQL_PASSWORD:-taskmanager_local_password}@tcp(mysql:3306)/${MYSQL_DATABASE:-taskmanager}?parseTime=true
      TEST_REDIS_ADDR: redis:6379
      TEST_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
